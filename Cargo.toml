[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
ast-grep-config = "=0.45.3"
ast-grep-core = "=0.45.3"
ast-grep-language = "=0.45.3"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
ctrlc = "=3.5.2"
gix = { version = "=0.87.1", default-features = false, features = ["basic", "dirwalk", "sha1", "sha256", "status", "worktree-mutation"] }
globset = "=0.4.20"
ignore = "=0.4.33"
indicatif = "=0.18.6"
insta = { version = "=1.48.0", features = ["json"] }
jiff = { version = "=0.2.37", features = ["serde"] }
miette = "=7.6.0"
nix = { version = "=0.31.3", features = ["process", "resource", "signal"] }
oxc_allocator = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_resolver = "=11.24.3"
oxc_semantic = "=0.150.0"
oxc_span = "=0.150.0"
petgraph = "=0.8.3"
pretty_assertions = "=1.4.1"
process-wrap = { version = "=10.0.0", default-features = false, features = ["std", "kill-on-drop", "process-group", "process-session"] }
rayon = "=1.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits", "functions"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=1.3.0"
serde-sarif = "=0.8.0"
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.0"
syn = { version = "=3.0.6", features = ["full"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tree-sitter = "=0.27.0"
tree-sitter-typescript = "=0.23.2"
wait-timeout = "=0.2.1"
