warrant-inventory = { version = "0.1.0", path = "../inventory" }
warrant-judgment = { version = "0.1.0", path = "../judgment" }
warrant-lang-rust = { version = "0.1.0", path = "../lang-rust" }
warrant-lang-ts = { version = "0.1.0", path = "../lang-ts" }
warrant-model = { version = "0.1.0", path = "../model" }
warrant-render = { version = "0.1.0", path = "../render" }
warrant-snapshot = { version = "0.1.0", path = "../snapshot" }
