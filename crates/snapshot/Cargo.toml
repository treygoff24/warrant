[package]
name = "warrant-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# S3 native capture stays off by default: parity is unmeasured over the
# corpus, so the temporary-index Git path remains authoritative (ruling F33).
native-capture = []

[dependencies]
gix.workspace = true
globset.workspace = true
ignore.workspace = true
jiff.workspace = true
serde.workspace = true
sha2.workspace = true
warrant-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
